  version: 1.0.0
openapi: 3.1.0
paths:
  /v1/catalogs/cancel-reasons:
    get:
      description: The reasons you can send as reason_id on POST /v1/shipments/{id}/cancel. Your operator decides which reasons clients may use.
      operationId: partner-list-cancel-reasons
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelReasonListResponseBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: List cancel reasons
      tags:
        - Catalogs
  /v1/catalogs/locations:
    get:
      description: One tier at a time via `level` — e.g. level=state&parent_id=<country id> lists a country's states, level=city&parent_id=<state id> lists a state's cities.
      operationId: partner-list-locations
      parameters:
        - description: Which tier to list
          explode: false
          in: query
          name: level
          schema:
            description: Which tier to list
            enum:
              - country
              - state
              - city
            type: string
        - description: Restrict to children of this location (e.g. cities of a given state)
          explode: false
          in: query
          name: parent_id
          schema:
            description: Restrict to children of this location (e.g. cities of a given state)
            format: uuid
            type: string
        - description: Search by name
          explode: false
          in: query
          name: search
          schema:
            description: Search by name
            type: string
        - description: Page number
          explode: false
          in: query
          name: page
          schema:
            default: 1
            description: Page number
            format: int64
            minimum: 1
            type: integer
        - description: Items per page
          explode: false
          in: query
          name: page_size
          schema:
            default: 100
            description: Items per page
            format: int64
            maximum: 200
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationListResponseBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: List countries, states, or cities
      tags:
        - Catalogs
  /v1/catalogs/novelty-types:
    get:
      description: "The reasons a courier can give when a delivery attempt fails (\"destinatario ausente\", \"dirección incorrecta\"...). They come as novelty.type_id and novelty.type_name in GET /v1/shipments/{id}/events and in the shipment.state_changed webhook. Tenant-configurable: map them by id."
      operationId: partner-list-novelty-types
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoveltyTypeListResponseBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: List failed-delivery reasons
      tags:
        - Catalogs
  /v1/catalogs/payment-methods:
    get:
      description: "The active payment methods, for payment_method_id on POST /v1/shipments. It is optional: with payment_type cod, send the cash one when you send it. An unknown or inactive id answers 422 on creation."
      operationId: partner-list-payment-methods
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListPaymentMethodsResponseBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: List payment methods
      tags:
        - Catalogs
  /v1/catalogs/shipment-types:
    get:
      operationId: partner-list-shipment-types
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListShipmentTypesResponseBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: List shipment types
      tags:
        - Catalogs
  /v1/catalogs/statuses:
    get:
      description: |-
        Valid values for a shipment's current_state, and for the current_state filter on GET /v1/shipments. Tenant-configurable, so these aren't a fixed global list: key your logic off the flags and outcome, not off the codes.

        is_final marks the states a shipment never leaves; outcome says how it ended (delivered, cancelled, returned, lost, abandoned). is_novelty is a failed delivery attempt (outcome failed_attempt), and is_return marks every step of a return to sender.
      operationId: partner-list-statuses
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListStatusesResponseBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: List shipment statuses
      tags:
        - Catalogs
  /v1/catalogs/warehouses:
    get:
      description: |-
        The warehouses you may use as warehouse_id on POST /v1/shipments, active ones only: the carrier's warehouses (no client_id) plus your own sucursales (client_id set to your client). Other clients' sucursales are never listed.

        With a carrier warehouse, is_pickup=true means we pick the package up at your address, and false means you drop it off there. A sucursal only accepts is_pickup=false: the package is already there. See "Bodegas" in the API description for the full table.
      operationId: partner-list-warehouses
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WarehouseListResponseBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: List warehouses you can ship from
      tags:
        - Catalogs
  /v1/forms/assignments:
    post:
      description: |-
        Assigns a form (a workflow of your operator with the office.assigned event) to a driver, about one of your shipments. The driver gets a push notification and the form shows up in the app; the result arrives in the form.run.submitted webhook and in GET /v1/forms/runs/{id}.

        Idempotent by external_ref: repeating a request with the same external_ref returns the existing assignment with 200 instead of 201. Requires the operator to have the Forms & Workflows module.
      operationId: partner-create-form-assignment
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFormAssignmentRequestBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FormsAssignmentView"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Ask a driver to fill in a form about one of your shipments
      tags:
        - Forms
  /v1/forms/runs/{id}:
    get:
      description: The forms the driver filled in (schema and answers), the outcome (pass, flagged, blocked), the status (completed, pending_approval, approved, rejected), incidents and signed links to photos, signatures and files (valid for 15 minutes). Only runs of your own shipments; any other id is not found.
      operationId: partner-get-form-run
      parameters:
        - description: Run id (it comes in the form.run.* webhooks)
          in: path
          name: id
          required: true
          schema:
            description: Run id (it comes in the form.run.* webhooks)
            format: uuid
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FormsPartnerRunView"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: Get a form run of one of your shipments
      tags:
        - Forms
  /v1/quotes:
    post:
      description: |-
        Prices a shipment without creating it, with your active price list. Send the same payment_type, cod_amount, declared_value, weight and dimensions you would send to POST /v1/shipments: creating it with those values is charged total_price, as long as your price list doesn't change in between and the shipment gets the same service type: when your list prices each type (Same Day, Next Day...), the quote uses the type a shipment created right now would get.

        The response is just total_price (taxes included) and chargeable_weight_kg, the weight the price is computed with.

        Returns the same 422s creation would for the same data (payment rules, unknown city, no price list). Today the price does not depend on the destination; recipient_city_id is optional and only validated.
      operationId: partner-quote-shipment
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PartnerQuoteRequestBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartnerQuoteResponseBody"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      security:
        - bearer: []
      summary: Quote a shipment
      tags:
        - Quotes
  /v1/shipments:
    get:
      operationId: partner-list-shipments
      parameters:
        - description: Page number
          explode: false
          in: query
          name: page
          schema:
            default: 1
            description: Page number
            format: int64
            minimum: 1
            type: integer
        - description: Items per page
          explode: false
          in: query
          name: page_size
          schema:
            default: 25
            description: Items per page
            format: int64
            maximum: 100
            minimum: 1
            type: integer
        - description: Filter by current state code
          explode: false
          in: query
          name: current_state
          schema:
            description: Filter by current state code
            type: string
        - description: Search by tracking number or order number
          explode: false
          in: query
          name: search
          schema:
            description: Search by tracking number or order number
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShipmentListResponseBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - bearer: []
      summary: List your own shipments
      tags:
        - Shipments
    post:
      description: |-
        Creates a shipment for your client and answers it with its tracking_number, label_url, tracking_url and shipping_price.

        Send an Idempotency-Key header (any unique value, such as a UUID) to make retries safe: a retry with the same key and the same body creates nothing and answers the shipment the first request created, with Idempotent-Replayed: true. The same key with a different body answers 422; while the first request is still running, 409. A key lasts 24 hours. A request that fails does not use up its key, so you can fix it and retry with the same one.

        order_number is also unique across the operation: a second shipment with the same one answers 409 and, when the existing shipment is yours, errors[0].value carries its shipment_id and tracking_number. Another client's shipment answers 409 with no ids.

        422 when the data breaks a rule: a missing or unknown warehouse_id, is_pickup missing, a recipient_city_id that does not exist or is not a city, an unknown or inactive payment_method_id, cod_amount missing for cod or sent for prepaid, declared_value different from cod_amount, or no price list for your account.
      operationId: partner-create-shipment
      parameters:
        - description: "Any unique value per shipment, such as a UUID. A retry with the same key and body answers the shipment already created (Idempotent-Replayed: true) instead of creating another. Kept for 24 hours"
          in: header
          name: Idempotency-Key
          schema:
            description: "Any unique value per shipment, such as a UUID. A retry with the same key and body answers the shipment already created (Idempotent-Replayed: true) instead of creating another. Kept for 24 hours"
            maxLength: 255
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateShipmentRequestBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShipmentDetail"
          description: OK
          headers:
            Idempotent-Replayed:
              schema:
                description: "true when this answers a retry with an Idempotency-Key already used: the shipment was created by the earlier request, not by this one"
                type: string
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Conflict
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      security:
        - bearer: []
      summary: Create a shipment
      tags:
        - Shipments
  /v1/shipments/tracking/{tracking}:
    get:
      operationId: partner-get-shipment-by-tracking
      parameters:
        - description: Tracking number
          in: path
          name: tracking
          required: true
          schema:
            description: Tracking number
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShipmentDetail"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      security:
        - bearer: []
      summary: Get one of your own shipments by tracking number
      tags:
        - Shipments
  /v1/shipments/{id}:
    get:
      description: "The shipment as it is now: current_state, delivery_attempts, the recipient's address with its complement and reference, notes, shipping_price, label_url and tracking_url. Another client's shipment answers 404, never 403."
      operationId: partner-get-shipment
      parameters:
        - description: Shipment ID
          in: path
          name: id
          required: true
          schema:
            description: Shipment ID
            format: uuid
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShipmentDetail"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      security:
        - bearer: []
      summary: Get one of your own shipments by ID
      tags:
        - Shipments
  /v1/shipments/{id}/cancel:
    post:
      description: |-
        Cancels a shipment that has not gone out for delivery yet: in its initial state (is_initial in GET /v1/catalogs/statuses), or waiting in a warehouse with no delivery attempt and not on a planned or running route. Once it is on a route, out for delivery or back from a failed attempt, the answer is 409 and the cancellation has to be asked to your operator.

        A shipment created with is_pickup=false moves to "in warehouse" right after creation; it can still be cancelled here until the operation puts it on a route.

        The response is the cancelled shipment. If you subscribe to webhooks, shipment.state_changed and shipment.cancelled go out too.

        404 when the shipment does not exist or is another client's, 409 when it is already on a route, out for delivery, past a delivery attempt or in a final state, 422 when reason_id is not one of yours or the reason requires a comment.
      operationId: partner-cancel-shipment
      parameters:
        - description: Shipment ID
          in: path
          name: id
          required: true
          schema:
            description: Shipment ID
            format: uuid
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelShipmentRequestBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShipmentDetail"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Conflict
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      security:
        - bearer: []
      summary: Cancel one of your shipments
      tags:
        - Shipments
  /v1/shipments/{id}/events:
    get:
      description: |-
        Every state change of one of your shipments, oldest first: the state it moved into (code and name), when, the notes recorded with it and, for deliveries, the courier's photo and the recipient's signature when available.

        A failed delivery attempt also carries attempt_number and a novelty object with the reason (type_id and type_name, see GET /v1/catalogs/novelty-types), the courier's description and, when agreed, the date of the next attempt.

        The current state is the last event, and also current_state on GET /v1/shipments/{id}. To be told about changes as they happen instead of polling, subscribe to the shipment.state_changed webhook.
      operationId: partner-list-shipment-events
      parameters:
        - description: Shipment ID
          in: path
          name: id
          required: true
          schema:
            description: Shipment ID
            format: uuid
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShipmentEventsResponseBody"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      security:
        - bearer: []
      summary: Get a shipment's tracking history
      tags:
        - Shipments
  /v1/shipments/{id}/label:
    get:
      description: |-
        Returns the label of one of your shipments as a PDF: a 4x6 in page with the tracking number as barcode and QR, sender, recipient, pieces, weight and the amount to collect. It is generated on each request, so it always matches the shipment as it is now.

        It is the same document label_url opens without authentication; use this endpoint when you would rather download it with your API key than share a link.
      operationId: partner-get-shipment-label
      parameters:
        - description: Shipment ID
          in: path
          name: id
          required: true
          schema:
            description: Shipment ID
            format: uuid
            type: string
      responses:
        "200":
          content:
            application/pdf:
              schema:
                contentMediaType: application/octet-stream
                format: binary
                type: string
          description: The label, as application/pdf.
          headers:
            Cache-Control:
              schema:
                type: string
            Content-Disposition:
              schema:
                type: string
            Content-Type:
              schema:
                type: string
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      security:
        - bearer: []
      summary: Download a shipment's label (PDF)
      tags:
        - Shipments
servers:
  - url: /partner
webhooks:
  form.incident.created:
    post:
      description: Las respuestas de un formulario abrieron una incidencia (por ejemplo, temperatura fuera de rango o diferencia en el recaudo).
      operationId: webhook-form.incident.created
      parameters:
        - description: "Identificador de esta entrega. Es el mismo en todos los reintentos: úsalo para descartar duplicados."
          in: header
          name: X-Webhook-ID
          required: true
          schema:
            format: uuid
            type: string
        - description: El mismo valor de `event` del body.
          in: header
          name: X-Webhook-Event
          required: true
          schema:
            type: string
        - description: Número de intento, de 1 a 8.
          in: header
          name: X-Webhook-Attempt
          required: true
          schema:
            minimum: 1
            type: integer
        - description: Segundos Unix de este intento. Es el mismo `t` de la firma.
          in: header
          name: X-Webhook-Timestamp
          required: true
          schema:
            type: string
        - description: "`t=<timestamp>,v1=<hmac>`: HMAC-SHA256 en hexadecimal de `<timestamp>.<body>` con tu secreto `whsec_...` como llave. Ver \"Webhooks → Verificar la firma\" en la descripción de la API."
          in: header
          name: X-Webhook-Signature
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            example:
              event: form.incident.created
              tenant_id: 0b8f1c2e-4d5a-4e6f-8a9b-1c2d3e4f5a6b
              timestamp: "2026-09-25T15:04:05Z"
              run:
                id: 6f1e2d3c-4b5a-4968-8776-5a4b3c2d1e0f
                workflow_id: 2a3b4c5d-6e7f-4a8b-9c0d-1e2f3a4b5c6d
                workflow_name: Control de cadena de frío
                event: shipment.before_transition
                outcome: blocked
                status: completed
                flags:
                  - sla:cold_chain
                shipment_id: 3f1c2b7e-8a4d-4f0e-9b6a-2d5c1e7f9a10
                tracking_number: EXP000123456
                occurred_at: "2026-09-25T15:03:40Z"
              incident:
                id: 9d8c7b6a-5f4e-4d3c-8b2a-1f0e9d8c7b6a
                number: INC-000042
                title: Temperatura fuera de rango
                category: cold_chain
                severity: critical
                status: open
                created_at: "2026-09-25T15:04:05Z"
            schema:
              $ref: "#/components/schemas/PartnerFormWebhookEvent"
        required: true
      responses:
        "200":
          description: Recibido. Cualquier 2xx sirve; el body de la respuesta se ignora.
        default:
          description: Cualquier otra respuesta, o no responder en 10 segundos, se reintenta.
      summary: Incidencia abierta
      tags:
        - Webhooks
  form.incident.resolved:
    post:
      description: La incidencia se resolvió; `incident.resolution_note` explica cómo.
      operationId: webhook-form.incident.resolved
      parameters:
        - description: "Identificador de esta entrega. Es el mismo en todos los reintentos: úsalo para descartar duplicados."
          in: header
          name: X-Webhook-ID
          required: true
          schema:
            format: uuid
            type: string
        - description: El mismo valor de `event` del body.
          in: header
          name: X-Webhook-Event
          required: true
          schema:
            type: string
        - description: Número de intento, de 1 a 8.
          in: header
          name: X-Webhook-Attempt
          required: true
          schema:
