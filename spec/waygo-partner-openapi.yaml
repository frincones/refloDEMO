components:
  schemas:
    CancelReasonListResponseBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/CancelReasonListResponseBody.json
          format: uri
          readOnly: true
          type: string
        data:
          items:
            $ref: "#/components/schemas/CancelReasonSummary"
          type:
            - array
            - "null"
      required:
        - data
      type: object
    CancelReasonSummary:
      additionalProperties: false
      properties:
        code:
          type: string
        id:
          description: Use it as reason_id on POST /v1/shipments/{id}/cancel
          type: string
        name:
          type: string
        require_comment:
          description: The cancellation needs a comment with this reason
          type: boolean
      required:
        - id
        - name
        - require_comment
      type: object
    CancelShipmentRequestBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/CancelShipmentRequestBody.json
          format: uri
          readOnly: true
          type: string
        comment:
          description: Required when the reason has require_comment
          maxLength: 500
          type: string
        reason_id:
          description: Why you cancel it — see GET /v1/catalogs/cancel-reasons
          format: uuid
          type: string
      required:
        - reason_id
      type: object
    CreateFormAssignmentRequestBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/CreateFormAssignmentRequestBody.json
          format: uri
          readOnly: true
          type: string
        blocking:
          description: The driver cannot go on with the shipment until the form is filled in
          type: boolean
        courier_id:
          description: Driver that must fill in the form
          type: string
        due_at:
          description: Deadline (RFC 3339). After it the assignment expires
          format: date-time
          type: string
        external_ref:
          description: Your own id for this request. Sending the same external_ref again returns the existing assignment instead of creating another
          maxLength: 120
          type: string
        note:
          description: Shown to the driver
          maxLength: 2000
          type: string
        route_id:
          description: Route of the operator, if known
          type: string
        shipment_id:
          description: "One of your shipments: the form is about it"
          type: string
        stop_id:
          description: Stop of that route, if known
          type: string
        vehicle_id:
          description: Vehicle, if known
          type: string
        workflow_id:
          description: Workflow of your operator, active, with the office.assigned event. Ask your operator for its id
          type: string
      required:
        - workflow_id
        - courier_id
        - shipment_id
      type: object
    CreateShipmentRequestBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/CreateShipmentRequestBody.json
          format: uri
          readOnly: true
          type: string
        cod_amount:
          description: Amount to collect on delivery; required when payment_type is cod
          format: double
          type: number
        declared_value:
          description: Merchandise declared value
          format: double
          type: number
        height_cm:
          description: Package height in cm. Dimensions count only when all three are sent
          format: int64
          type: integer
        is_pickup:
          description: Whether this shipment needs pickup at your address. Required — send false explicitly rather than omitting it. When false, the shipment moves straight to "in warehouse" after creation.
          type: boolean
        length_cm:
          description: Package length in cm. Dimensions count only when all three are sent; the price uses the greater of weight and length × width × height / 5000
          format: int64
          type: integer
        notes:
          description: Instructions for the courier, such as "llamar antes de llegar" or what the package contains. Printed on the label (first 200 characters) and shown in the courier app
          maxLength: 500
          type: string
        order_number:
          description: "Your own order number; a tracking number is generated automatically either way. Unique across the operation: repeating one answers 409, with your existing shipment's id when it is yours. For safe retries, send the Idempotency-Key header too"
          maxLength: 50
          type: string
        payment_method_id:
          description: Payment method ID — see GET /v1/catalogs/payment-methods
          format: uuid
          type: string
        payment_type:
          description: prepaid or cod
          enum:
            - prepaid
            - cod
          type: string
        pieces_count:
          default: 1
          description: Number of pieces
          format: int64
          minimum: 1
          type: integer
        recipient_address:
          description: Recipient address
          minLength: 1
          type: string
        recipient_address_line2:
          description: "Additional address details: apartment, tower, office. Printed on the label right after the street and shown in the courier app"
          type: string
        recipient_city_id:
          description: Recipient city ID — required. Look it up via GET /v1/catalogs/locations?level=city. A country or state id is rejected with 422
          format: uuid
          type: string
        recipient_name:
          description: Recipient name
          maxLength: 255
          minLength: 1
          type: string
        recipient_phone:
          description: Recipient phone
          maxLength: 20
          type: string
        recipient_reference:
          description: A landmark near the address, e.g. "frente al parque". Printed on the label and shown in the courier app
          maxLength: 255
          type: string
        sender_name:
          description: "Name printed as the sender on the label, e.g. the store you ship for. Optional: without it the label shows your account's name. Only the name and phone change — the sender address, the pickup point and where returns go are still your account's address"
          maxLength: 255
          type: string
        sender_phone:
          description: "Phone printed with the sender on the label. Optional: without it the label shows your account's contact phone. Return notices still go to your account's contact phone"
          maxLength: 20
          type: string
        warehouse_id:
          description: Warehouse this shipment is assigned to — required. Look it up via GET /v1/catalogs/warehouses. If it belongs to a client (a "sucursal"), is_pickup must be false.
          format: uuid
          type: string
        weight:
          description: "Weight in kg. Send it always: without weight and dimensions the shipment is priced at 0 kg, the lowest range of your price list"
          format: double
          type: number
        width_cm:
          description: Package width in cm. Dimensions count only when all three are sent
          format: int64
          type: integer
      required:
        - warehouse_id
        - is_pickup
        - recipient_name
        - recipient_address
        - recipient_city_id
        - payment_type
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ErrorModel.json
          format: uri
          readOnly: true
          type: string
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
          format: uri
          type: string
      type: object
    EventNovelty:
      additionalProperties: false
      properties:
        description:
          description: What the courier wrote
          type: string
        reschedule_date:
          description: Date agreed with the recipient for the next attempt, when there is one
          format: date
          type: string
        type_id:
          description: See GET /v1/catalogs/novelty-types
          type: string
        type_name:
          description: e.g. Destinatario ausente
          type: string
      required:
        - type_id
      type: object
    FormsAssignmentView:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/FormsAssignmentView.json
          format: uri
          readOnly: true
          type: string
        blocking:
          type: boolean
        courier_id:
          type: string
        courier_name:
          type: string
        created_at:
          format: date-time
          type: string
        created_by:
          type: string
        due_at:
          format: date-time
          type: string
        id:
          type: string
        note:
          type: string
        route_code:
          type: string
        route_id:
          type: string
        run_id:
          type: string
        shipment_id:
          type: string
        source:
          type: string
        source_ref:
          type: string
        status:
          type: string
        stop_id:
          type: string
        tracking_number:
          type: string
        updated_at:
          format: date-time
          type: string
        vehicle_id:
          type: string
        workflow_id:
          type: string
        workflow_name:
          type: string
      required:
        - id
        - workflow_id
        - workflow_name
        - courier_id
        - source
        - blocking
        - status
        - created_at
        - updated_at
      type: object
    FormsPartnerIncidentBrief:
      additionalProperties: false
      properties:
        number:
          type: string
        severity:
          type: string
        status:
          type: string
        title:
          type: string
      required:
        - number
        - title
        - severity
        - status
      type: object
    FormsPartnerRunForm:
      additionalProperties: false
      properties:
        answers: {}
        form_name:
          type: string
        node_id:
          type: string
        schema: {}
        title_text:
          type: string
        version:
          format: int64
          type: integer
      required:
        - node_id
        - form_name
        - title_text
        - version
        - schema
        - answers
      type: object
    FormsPartnerRunView:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/FormsPartnerRunView.json
          format: uri
          readOnly: true
          type: string
        assignment_id:
          type: string
        event:
          type: string
        file_urls:
          additionalProperties:
            type: string
          type: object
        flags:
          items:
            type: string
          type:
            - array
            - "null"
        forms:
          items:
            $ref: "#/components/schemas/FormsPartnerRunForm"
          type:
            - array
            - "null"
        id:
          type: string
        incidents:
          items:
            $ref: "#/components/schemas/FormsPartnerIncidentBrief"
          type:
            - array
            - "null"
        latitude:
          format: double
          type: number
        longitude:
          format: double
          type: number
        occurred_at:
          format: date-time
          type: string
        outcome:
          type: string
        route_id:
          type: string
        shipment_id:
          type: string
        status:
          type: string
        submitted_at:
          format: date-time
          type: string
        tracking_number:
          type: string
        workflow_id:
          type: string
        workflow_name:
          type: string
      required:
        - id
        - workflow_id
        - workflow_name
        - event
        - status
        - outcome
        - flags
        - occurred_at
        - submitted_at
        - forms
        - file_urls
        - incidents
      type: object
    ListPaymentMethodsResponseBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ListPaymentMethodsResponseBody.json
          format: uri
          readOnly: true
          type: string
        data:
          items:
            $ref: "#/components/schemas/PaymentMethodSummary"
          type:
            - array
            - "null"
      required:
        - data
      type: object
    ListShipmentTypesResponseBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ListShipmentTypesResponseBody.json
          format: uri
          readOnly: true
          type: string
        data:
          items:
            $ref: "#/components/schemas/ShipmentTypeSummary"
          type:
            - array
            - "null"
      required:
        - data
      type: object
    ListStatusesResponseBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ListStatusesResponseBody.json
          format: uri
          readOnly: true
          type: string
        data:
          items:
            $ref: "#/components/schemas/StatusSummary"
          type:
            - array
            - "null"
      required:
        - data
      type: object
    LocationListResponseBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/LocationListResponseBody.json
          format: uri
          readOnly: true
          type: string
        data:
          items:
            $ref: "#/components/schemas/LocationSummary"
          type:
            - array
            - "null"
        meta:
          $ref: "#/components/schemas/PageMeta"
      required:
        - data
        - meta
      type: object
    LocationSummary:
      additionalProperties: false
      properties:
        code:
          type: string
        id:
          type: string
        name:
          type: string
        parent_id:
          type: string
      required:
        - id
        - name
      type: object
    NoveltyTypeListResponseBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/NoveltyTypeListResponseBody.json
          format: uri
          readOnly: true
          type: string
        data:
          items:
            $ref: "#/components/schemas/NoveltyTypeSummary"
          type:
            - array
            - "null"
      required:
        - data
      type: object
    NoveltyTypeSummary:
      additionalProperties: false
      properties:
        id:
          description: The type_id of an event's novelty object
          type: string
        name:
          type: string
      required:
        - id
        - name
      type: object
    PageMeta:
      additionalProperties: false
      properties:
        page:
          format: int64
          type: integer
        page_size:
          format: int64
          type: integer
        total:
          format: int64
          type: integer
        total_pages:
          format: int64
          type: integer
      required:
        - page
        - page_size
        - total
        - total_pages
      type: object
    PartnerFormWebhookEvent:
      additionalProperties: false
      properties:
        data:
          additionalProperties: {}
          description: Datos adicionales (en form.<nombre>, el nodo que lo disparó)
          type: object
        event:
          description: form.run.submitted, form.run.approved, form.run.rejected, form.incident.created, form.incident.resolved o form.<nombre> de un workflow
          type: string
        incident:
          $ref: "#/components/schemas/PartnerFormWebhookIncident"
          description: Solo en form.incident.*
        run:
          $ref: "#/components/schemas/PartnerFormWebhookRun"
          description: La ejecución del formulario
        tenant_id:
          description: Operador
          format: uuid
          type: string
        timestamp:
          description: Cuándo ocurrió el evento (UTC)
          format: date-time
          type: string
      required:
        - event
        - tenant_id
        - timestamp
      type: object
    PartnerFormWebhookIncident:
      additionalProperties: false
      properties:
        category:
          type: string
        created_at:
          format: date-time
          type: string
        id:
          format: uuid
          type: string
        number:
          description: INC-000123
          type: string
        resolution_note:
          type: string
        resolved_at:
          format: date-time
          type: string
        severity:
          enum:
            - info
            - warning
            - critical
          type: string
        status:
          enum:
            - open
            - acknowledged
            - in_progress
            - resolved
            - dismissed
          type: string
        title:
          type: string
      required:
        - id
        - number
        - title
        - category
        - severity
        - status
        - created_at
      type: object
    PartnerFormWebhookRun:
      additionalProperties: false
      properties:
        event:
          description: Momento de la operación en que se llenó (shipment.before_transition, stop.arrived, office.assigned...)
          type: string
        flags:
          items:
            type: string
          type:
            - array
            - "null"
        id:
          description: Id para GET /v1/forms/runs/{id}
          format: uuid
          type: string
        occurred_at:
          description: Cuándo lo llenó el conductor (UTC)
          format: date-time
          type: string
        outcome:
          enum:
            - pass
            - flagged
            - blocked
          type: string
        route_id:
          format: uuid
          type: string
        shipment_id:
          format: uuid
          type: string
        status:
          enum:
            - completed
            - pending_approval
            - approved
            - rejected
            - cancelled
          type: string
        tracking_number:
          type: string
        workflow_id:
          format: uuid
          type: string
        workflow_name:
          type: string
      required:
        - id
        - workflow_id
        - workflow_name
        - event
        - outcome
        - status
        - flags
        - occurred_at
      type: object
    PartnerQuoteRequestBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/PartnerQuoteRequestBody.json
          format: uri
          readOnly: true
          type: string
        cod_amount:
          description: Amount to collect on delivery; required when payment_type is cod
          format: double
          type: number
        declared_value:
          description: Merchandise declared value. For cod it must equal cod_amount, and defaults to it when omitted
          format: double
          type: number
        height_cm:
          description: Package height in cm. Dimensions count only when all three are sent
          format: int64
          type: integer
        length_cm:
          description: Package length in cm. Dimensions count only when all three are sent; the price uses the greater of weight and length × width × height / 5000
          format: int64
          type: integer
        payment_type:
          description: prepaid or cod. Required.
          enum:
            - prepaid
            - cod
          type: string
        recipient_city_id:
          description: Optional. When sent it must exist (GET /v1/catalogs/locations?level=city). Today the price does not depend on the destination
          format: uuid
          type: string
        weight:
          description: "Weight in kg. Send it always: without weight and dimensions the shipment is priced at 0 kg, the lowest range of your price list"
          format: double
          type: number
        width_cm:
          description: Package width in cm. Dimensions count only when all three are sent
          format: int64
          type: integer
      required:
        - payment_type
      type: object
    PartnerQuoteResponseBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/PartnerQuoteResponseBody.json
          format: uri
          readOnly: true
          type: string
        chargeable_weight_kg:
          description: The greater of weight and volumetric weight (length × width × height / 5000)
          format: double
          type: number
        total_price:
          description: What creating this shipment with the same data costs, taxes included, while your price list stays the same
          format: double
          type: number
      required:
        - total_price
        - chargeable_weight_kg
      type: object
    PartnerWebhookEvent:
      additionalProperties: false
      properties:
        client_id:
          description: Cliente dueño del envío
          format: uuid
          type: string
        data:
          $ref: "#/components/schemas/PartnerWebhookEventData"
          description: Datos adicionales del envío y de la evidencia del cambio de estado
        event:
          description: Tipo de evento
          enum:
            - shipment.created
            - shipment.state_changed
            - shipment.delivered
            - shipment.cancelled
            - temperature.excursion
          type: string
        from_state:
          description: Código del estado anterior; vacío en shipment.created. Ver GET /v1/catalogs/statuses
          type: string
        order_number:
          description: Tu número de orden
          type: string
        shipment_id:
          description: ID del envío (el mismo de GET /v1/shipments/{id})
          format: uuid
          type: string
        timestamp:
          description: Cuándo ocurrió el evento (UTC). Es igual en todos los reintentos
          format: date-time
          type: string
        to_state:
          description: Código del estado nuevo. Ver GET /v1/catalogs/statuses
          type: string
        tracking_number:
          description: Número de guía
          type: string
      required:
        - event
        - shipment_id
        - from_state
        - to_state
        - timestamp
      type: object
    PartnerWebhookEventData:
      additionalProperties: false
      properties:
        attempt_number:
          description: Intento de entrega al que pertenece este cambio, desde 1. No viene antes del primer intento
          format: int64
          type: integer
        courier_id:
          description: Conductor asignado, si hay
          format: uuid
          type: string
        excursion_id:
          description: "Solo en temperature.excursion: la excursión"
          format: uuid
          type: string
        kind:
          description: "Solo en temperature.excursion: tipo de excursión"
          enum:
            - temp_high
            - temp_low
            - humidity_high
            - humidity_low
          type: string
        notes:
          description: Notas del conductor o descripción de la novedad, si hay
          type: string
        novelty:
          $ref: "#/components/schemas/EventNovelty"
          description: "Solo cuando el envío entra a un estado de novedad (is_novelty en GET /v1/catalogs/statuses): la causal (type_id, type_name; ver GET /v1/catalogs/novelty-types), lo que escribió el conductor y la fecha acordada para el siguiente intento, si hay"
        photo_url:
          description: Foto tomada por el conductor en este cambio de estado, si hay. Si hubo varias, es la primera
          format: uri
          type: string
        photo_urls:
          description: Todas las fotos de este cambio de estado, en orden, cuando el estado pide más de una (por ejemplo fachada y paquete entregado)
          items:
            type: string
          type:
            - array
            - "null"
        recipient_address:
          description: Dirección del destinatario
          type: string
        recipient_name:
          description: Nombre del destinatario
          type: string
        severity:
          description: "Solo en temperature.excursion: severidad"
          enum:
            - warning
            - critical
          type: string
        signature_url:
          description: Firma de quien recibió, si hay
          format: uri
          type: string
        started_at:
          description: "Solo en temperature.excursion: inicio de la excursión"
          format: date-time
          type: string
        threshold_c:
          description: "Solo en temperature.excursion: límite que se cruzó, en °C (o % de humedad)"
          format: double
          type: number
        value_c:
          description: "Solo en temperature.excursion: valor más alejado del rango, en °C (o % de humedad)"
          format: double
          type: number
      required:
        - recipient_name
        - recipient_address
      type: object
    PaymentMethodSummary:
      additionalProperties: false
      properties:
        code:
          type: string
        id:
          type: string
        name:
          type: string
      required:
        - id
        - name
        - code
      type: object
    ShipmentDetail:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ShipmentDetail.json
          format: uri
          readOnly: true
          type: string
        cod_amount:
          format: double
          type: number
        created_at:
          format: date-time
          type: string
        current_state:
          type: string
        current_state_name:
          type: string
        declared_value:
          format: double
          type: number
        delivery_attempts:
          format: int64
          type: integer
        height_cm:
          format: int64
          type: integer
        id:
          type: string
        is_cod:
          type: boolean
        is_pickup:
