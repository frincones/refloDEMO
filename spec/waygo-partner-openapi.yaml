info:
  description: |-
    API pública para integración de clientes externos: crear y consultar sus propios envíos, y catálogos de referencia (tipos de envío, bodegas, países/departamentos/ciudades). Autenticación por API key de cliente (Authorization: Bearer tms_c_...).

    **Ambientes.** Hay un sandbox para probar tu integración antes de salir a producción:

    | Ambiente | URL base | Documentación |
    |---|---|---|
    | Producción | `https://api.waygo.pro/partner` | https://api.waygo.pro/partner/docs |
    | Sandbox | `https://dev-tms-api.waygo.pro/partner` | https://dev-tms-api.waygo.pro/partner/docs |

    - La URL base incluye `/partner`, y las rutas de esta documentación (`/v1/...`) van a continuación: por ejemplo, `POST https://dev-tms-api.waygo.pro/partner/v1/shipments`. Sin `/partner` la API responde 404.
    - Los dos ambientes tienen los mismos endpoints; solo cambia la URL base.
    - Cada petición lleva tu API key en el encabezado `Authorization: Bearer tms_c_...`.
    - Las API keys son de cada ambiente: la del sandbox no funciona en producción ni al revés. Pídele la del sandbox a tu operador.
    - Los envíos que crees en el sandbox no son reales: nadie los recoge ni los entrega. Sus `tracking_url` y `label_url` apuntan al sandbox.
    - Los webhooks se configuran aparte en cada ambiente, cada uno con su propio secreto.
    - El sandbox recibe las novedades antes que producción. No guardes ahí datos reales de tus clientes.
    - `tms-api.smartdigital.co` es el dominio anterior de producción y sigue respondiendo, pero integra contra `api.waygo.pro`.

    **Bodegas.** Cada envío sale de una bodega: `POST /v1/shipments` exige siempre `warehouse_id` e `is_pickup`, y sin alguno responde 422.

    `GET /v1/catalogs/warehouses` lista las bodegas que puedes usar como `warehouse_id`. Son de dos tipos:

    - **Bodegas de la operación** (sin `client_id`): las del transportador. Sirven para dejar ahí tus paquetes o para que salgamos a recogértelos.
    - **Tus sucursales** (con `client_id`, que es tu propio cliente): bodegas tuyas registradas en la plataforma. Solo ves las tuyas, nunca las de otros clientes.

    Ejemplo de respuesta:

    ```json
    {
      "data": [
        { "id": "a1000000-0000-0000-0000-000000000002", "name": "Bodega Bogotá", "code": "BOG-01" },
        { "id": "7c1e2f40-5b6a-4d8e-9f01-2a3b4c5d6e7f", "name": "Sucursal Chapinero", "code": "SUC-CHP", "client_id": "9b2e4c61-5d3a-4b8f-a1c7-6e0f2d8b3a55" }
      ]
    }
    ```

    Cómo combinar `warehouse_id` con `is_pickup`:

    | Bodega | `is_pickup` | Qué pasa |
    |---|---|---|
    | De la operación | `true` | Vamos a recoger el paquete a tu dirección y lo llevamos a esa bodega. |
    | De la operación | `false` | Tú llevas el paquete a esa bodega. El envío queda "en bodega" apenas se crea. |
    | Tu sucursal | `false` | El paquete ya está en tu sucursal. El envío queda "en bodega" apenas se crea. |
    | Tu sucursal | `true` | No se permite: 422. |

    Una bodega que no existe, o la sucursal de otro cliente, responde 422 con el mismo mensaje. Usa siempre ids del catálogo y consúltalo de vez en cuando en vez de dejarlos fijos: la lista solo trae bodegas activas y cambia cuando se abren o cierran bodegas.

    **Cotizar antes de crear.** `POST /v1/quotes` calcula el precio con tu lista de precios sin crear nada. Mándale los mismos `payment_type`, `cod_amount`, `declared_value`, `weight` y medidas que vas a mandar a `POST /v1/shipments`: al crearlo con esos valores se cobra el mismo `total_price`, mientras tu lista de precios no cambie y el envío caiga en el mismo tipo de servicio (ver **Tipo de servicio**). Responde solo `total_price` (impuestos incluidos) y `chargeable_weight_kg`, el mayor entre el peso real y el volumétrico (largo × ancho × alto / 5000), que es el que se cobra. Hoy la tarifa no depende del destino.

    **Peso y medidas.** Manda siempre `weight` y, si las tienes, las tres medidas (`length_cm`, `width_cm`, `height_cm`). Si no mandas ni peso ni medidas, el envío se crea igual pero con peso cobrable 0 kg, es decir, con el rango más bajo de tu lista de precios, aunque el paquete sea más grande. Las medidas cuentan solo si vienen las tres.

    **Tipo de servicio.** El tipo de servicio (por ejemplo Same Day o Next Day) no se elige al crear: se asigna solo, según la hora de creación y el horario de corte que configura tu operador. Por ejemplo, con corte a la 1:00 p. m., lo creado antes sale Same Day y lo creado después, Next Day. Cada envío lo trae en `shipment_type_code` y `shipment_type_name`, y `GET /v1/catalogs/shipment-types` lista los tipos. Si la hora de creación no cae en ningún horario configurado, el envío queda sin tipo. Tu lista de precios puede tener una tarifa por tipo: en ese caso el envío se cobra con la tarifa de su tipo, y un envío sin tipo, o de un tipo sin tarifa, se cobra con la tarifa base. `POST /v1/quotes` cotiza con el tipo que tendría un envío creado en ese momento. Pregúntale a tu operador cuál es su horario de corte.

    **Guía en PDF.** Cada envío trae `label_url`, un enlace público al PDF de su guía (rótulo de 4×6" con código de barras y QR), listo para imprimir o mostrarle a tu cliente. Viene en la respuesta de `POST /v1/shipments` y también al consultar o listar. No pide autenticación ni vence: el PDF se genera al abrirlo, así que siempre refleja el envío como está en ese momento. El enlace lleva un identificador aleatorio; compártelo solo con quien deba ver la guía, porque incluye los datos del destinatario.

    Si prefieres descargarla con tu API key en vez de usar el enlace público, `GET /v1/shipments/{id}/label` devuelve el mismo PDF (`application/pdf`), solo para tus propios envíos.

    **Remitente de la guía.** La guía sale con el nombre, el teléfono y la dirección de tu cuenta. Si envías a nombre de varias tiendas, manda `sender_name` y `sender_phone` en `POST /v1/shipments` y la guía sale con el nombre y el teléfono de la tienda. La dirección del remitente no cambia, porque de ella salen la recogida y la devolución, y los avisos de devolución siguen llegando al teléfono de contacto de tu cuenta. El detalle del envío devuelve los dos campos.

    **Seguimiento.** Hay tres formas de seguir un envío:

    - `tracking_url`: la página pública de seguimiento, lista para mandársela a tu cliente por correo o WhatsApp. Muestra el estado, la línea de tiempo, el mensajero en camino y la evidencia de entrega, sin login. Viene en cada envío, igual que `label_url`.
    - `GET /v1/shipments/{id}/events`: el historial de estados del envío, del más antiguo al más reciente, con el nombre de cada estado, la hora, las notas y, en las entregas, la foto y la firma. El estado actual también está en `current_state` de `GET /v1/shipments/{id}`.
    - Webhooks (ver la sección Webhooks): te avisamos de cada cambio en el momento, sin que tengas que consultar.

    **Reintentos e idempotencia.** Para que un reintento nunca cree una segunda guía, manda en `POST /v1/shipments` el encabezado `Idempotency-Key` con un valor único por envío (por ejemplo un UUID que generes y guardes con tu pedido). Si la petición se te cae por timeout, reintenta con la misma llave y el mismo cuerpo:

    | Caso | Respuesta |
    |---|---|
    | Primera petición con la llave | `200` con la guía creada |
    | Reintento con la misma llave y el mismo cuerpo | `200` con la misma guía y el encabezado `Idempotent-Replayed: true`; no se crea otra |
    | La misma llave con otro cuerpo | `422`: usa una llave nueva para un envío nuevo |
    | La misma llave mientras la primera petición sigue en curso | `409`: reintenta en unos segundos |
    | La primera petición falló (por ejemplo, un `422` por datos inválidos) | La llave queda libre: corrige y reintenta con la misma |

    Las llaves son de tu cliente y duran 24 horas.

    `order_number` también es único en toda la operación: no puede haber dos envíos vivos con el mismo número, aunque sean de clientes distintos. Un segundo envío con el mismo `order_number` responde **409** y, cuando el envío existente es tuyo, el error trae su `shipment_id` y `tracking_number` en `errors[0].value`, para que lo consultes en vez de crear otro:

    ```json
    {
      "status": 409,
      "detail": "order_number is already in use by one of your shipments: TMS-20261009-00595",
      "errors": [{ "location": "body.order_number", "value": { "shipment_id": "6f9c58a8-…", "tracking_number": "TMS-20261009-00595" } }]
    }
    ```

    Si el número lo tiene un envío de otro cliente, el 409 no trae ids: usa otro número. Para no chocar, ponle a tus números un prefijo propio (por ejemplo `ABC-1001`). Un envío cancelado libera su número. Si no mandas `order_number`, se genera uno (`ORD-…`); en ese caso, `Idempotency-Key` es tu única protección contra duplicados.

    **Cancelar.** `POST /v1/shipments/{id}/cancel` con un `reason_id` de `GET /v1/catalogs/cancel-reasons` cancela un envío que todavía no salió a reparto: en su estado inicial (`is_initial`) o esperando en bodega, sin intentos de entrega y fuera de toda ruta planificada o en curso. Un envío creado con `is_pickup: false` pasa a "en bodega" apenas se crea y se puede cancelar hasta que la operación lo pone en una ruta. Después responde 409 y la cancelación se le pide al operador. No hay endpoint para editar un envío: ver **Corregir un envío**.

    **Corregir un envío.** Por la API no se edita. Mientras no haya salido a reparto, cancélalo y créalo de nuevo: al cancelar, el `order_number` queda libre para reusarlo. Si ya salió y quedó en novedad, la dirección y el teléfono del destinatario se corrigen proponiendo la solución desde el portal de clientes, y el operador la aplica. El valor a recaudar solo lo cambia el operador, y solo hasta que el mensajero registra el cobro.

    **Indicaciones para el mensajero.** `notes` (hasta 500 caracteres) sale impreso en la guía (los primeros 200) y en la app del mensajero: úsalo para "llamar antes de llegar", horarios o el contenido del paquete. `recipient_address_line2` es el complemento de la dirección (apartamento, torre, oficina): sale en la guía justo después de la calle y en la app del mensajero. `recipient_reference` es un punto de referencia ("frente al parque"): sale en la guía, en el bloque de comentarios, y en la app.

    **Estados, novedades y devoluciones.** Los estados los configura cada operación, así que no dependas de los códigos: `GET /v1/catalogs/statuses` marca cada uno con `is_initial`, `is_final`, `is_novelty` (visita fallida) e `is_return` (devolución al remitente), y `outcome` dice cómo terminó (`delivered`, `cancelled`, `returned`, `lost`, `abandoned`, o `failed_attempt` en la novedad). Cuando una visita falla, el evento de `GET /v1/shipments/{id}/events` y el webhook `shipment.state_changed` traen `attempt_number` y un objeto `novelty` con la causal estructurada (`type_id`, `type_name`; ver `GET /v1/catalogs/novelty-types`), lo que escribió el mensajero y la fecha acordada para el siguiente intento, si la hay. La devolución no es automática: la decide la operación después de las novedades, y cada paso llega como `shipment.state_changed`.

    **Límites.** Hoy no hay un límite de peticiones por API key, pero mantente por debajo de 5 por segundo y reintenta con espera creciente ante un 5xx o un timeout. Si se agrega un límite, responderá **429** con el header `Retry-After` (segundos).

    ## Webhooks

    Además de consultar tus envíos, puedes recibir sus cambios en tu propio endpoint: cada evento llega como un `POST` con un JSON. Los eventos y su body están en la sección **Webhooks** de esta documentación.

    ### Cómo activarlos

    Los webhooks los configura el operador desde su panel (Configuración → API y Webhooks → pestaña Webhooks), con alcance **Cliente**: pásale la URL HTTPS donde quieres recibirlos y los eventos que te interesan. Al crearlos, el panel muestra **una sola vez** el secreto de firma (`whsec_...`); guárdalo como guardas tu API key. Solo recibes eventos de tus propios envíos. Si el secreto se filtra, pide que lo regeneren: el anterior deja de valer en ese momento. No hay un evento de prueba: el primero llega con el primer envío que crees después de activarlos. Para probar tu endpoint antes de salir a producción, usa el sandbox.

    ### Eventos

    | Evento | Cuándo sale |
    |---|---|
    | `shipment.created` | Se crea un envío tuyo |
    | `shipment.state_changed` | Cualquier cambio de estado |
    | `shipment.delivered` | El envío pasa a entregado |
    | `shipment.cancelled` | El envío pasa a cancelado |
    | `temperature.excursion` | La carga refrigerada salió de rango (módulo de temperatura) |
    | `form.run.submitted` | El conductor envió un formulario sobre un envío tuyo (módulo Formularios y Workflows) |
    | `form.run.approved` / `form.run.rejected` | Un supervisor decidió la aprobación que pedía ese formulario |
    | `form.incident.created` / `form.incident.resolved` | Las respuestas abrieron una incidencia, o se resolvió |
    | `form.<nombre>` | Eventos propios que tu operador configuró en sus workflows |

    Los eventos `form.*` tienen otro body: `{event, tenant_id, timestamp, run, incident?, data?}` (ver la sección Webhooks). El detalle completo de la ejecución, con fotos y firma, está en `GET /v1/forms/runs/{id}`.

    `from_state` y `to_state` son códigos de estado; los nombres están en `GET /v1/catalogs/statuses`. Una entrega o una cancelación manda dos webhooks si te suscribes a los dos eventos: el `state_changed` y el específico.

    ### Entrega y reintentos

    - Responde con un **2xx en menos de 10 segundos**. Cualquier otra respuesta, un timeout o una redirección (3xx) cuenta como falla. Si tu proceso es lento, responde primero y procesa después.
    - Si falla, se reintenta hasta completar **8 intentos**, esperando 30 s, 1 min, 5 min, 15 min, 30 min, 1 h y 3 h entre uno y otro (unas 5 horas en total). Después de eso el evento se descarta: si tu endpoint estuvo caído más tiempo, reconcilia con `GET /v1/shipments`.
    - Un mismo evento puede llegar **más de una vez**. Usa `X-Webhook-ID`, que no cambia entre reintentos, para no procesarlo dos veces.
    - **El orden no está garantizado.** Por ejemplo, un envío creado con `is_pickup: false` pasa de inmediato a "en bodega", y ese `state_changed` puede llegar antes que el `created`. Ordena por `timestamp`, que es la hora del evento, o consulta el estado actual con `GET /v1/shipments/{id}`.

    ### Verificar la firma

    Cada webhook trae `X-Webhook-Signature: t=<timestamp>,v1=<firma>`. Para verificarlo:

    1. Separa `t` y `v1` del header.
    2. Calcula HMAC-SHA256 con tu secreto `whsec_...` completo (con el prefijo) como llave, sobre el texto `<t>.<body>`, donde `<body>` es el body **tal como llegó**, sin volver a serializar el JSON.
    3. Compara el resultado, en hexadecimal minúscula, con `v1` usando una comparación de tiempo constante.
    4. Rechaza el webhook si `t` tiene más de 5 minutos de diferencia con tu reloj: así un tercero no puede reenviarte uno viejo.

    Node.js:

    ```js
    const crypto = require("crypto");

    function verify(rawBody, header, secret) {
      const parts = Object.fromEntries(header.split(",").map((p) => p.split("=")));
      const expected = crypto.createHmac("sha256", secret)
        .update(parts.t + "." + rawBody).digest("hex");
      const fresh = Math.abs(Date.now() / 1000 - Number(parts.t)) <= 300;
      return fresh && parts.v1?.length === expected.length &&
        crypto.timingSafeEqual(Buffer.from(parts.v1), Buffer.from(expected));
    }
    ```

    Python:

    ```python
    import hashlib, hmac, time

    def verify(raw_body: bytes, header: str, secret: str) -> bool:
        parts = dict(p.split("=", 1) for p in header.split(","))
        expected = hmac.new(secret.encode(), parts["t"].encode() + b"." + raw_body,
                            hashlib.sha256).hexdigest()
        fresh = abs(time.time() - int(parts["t"])) <= 300
        return fresh and hmac.compare_digest(expected, parts.get("v1", ""))
    ```

    Si recibes `X-Webhook-Signature: sha256=...` (sin `t=`), la suscripción es de antes de este esquema de firma y no se puede verificar con tu secreto: pide que la regeneren.
